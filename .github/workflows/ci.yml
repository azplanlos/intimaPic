name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (App)
        run: npx tsc --project tsconfig.app.json --noEmit

      - name: TypeScript check (ServiceWorker)
        run: npx tsc --project tsconfig.sw.json --noEmit

      - name: Run unit tests
        run: npx ng test --no-watch --browsers=ChromeHeadless

      - name: Build ServiceWorker
        run: node build-sw.mjs

      - name: Build Angular app
        run: npx ng build --configuration=production

      - name: Verify ServiceWorker bundle exists
        run: test -f dist/intimapic/browser/sw.js && echo "✅ sw.js exists ($(wc -c < dist/intimapic/browser/sw.js) bytes)" || (echo "❌ sw.js missing!" && exit 1)
