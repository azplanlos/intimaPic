name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets permissions for GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx ng test --no-watch --browsers=ChromeHeadless

      - name: Inject Azure credentials from secrets
        run: |
          sed -i "s|__AZURE_CLIENT_ID__|${{ secrets.AZURE_CLIENT_ID }}|g" src/environments/environment.prod.ts
          sed -i "s|__AZURE_TENANT_ID__|${{ secrets.AZURE_TENANT_ID }}|g" src/environments/environment.prod.ts

      - name: Build Angular app for production
        run: npx ng build --configuration=production --base-href /intimaPic/ --output-path dist/app

      - name: Build ServiceWorker
        run: node build-sw.mjs
        env:
          # Override output path to match Angular's output
          SW_OUTPUT_DIR: dist/app/browser

      - name: Verify ServiceWorker exists
        run: test -f dist/app/browser/sw.js && echo "✅ sw.js exists ($(wc -c < dist/app/browser/sw.js) bytes)" || (echo "❌ sw.js missing!" && exit 1)

      - name: Copy index.html to 404.html (SPA routing)
        run: cp dist/app/browser/index.html dist/app/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/app/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
